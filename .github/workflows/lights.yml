name: Lights tests

on:
  pull_request:
    paths:
      - "lights/**"
      - ".github/workflows/lights.yml"
  push:
    branches: [main]
    paths:
      - "lights/**"
      - ".github/workflows/lights.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: lights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark smoke test
        run: python -m glorbleds.benchmark --frames 5 --fps 30
