<line x1="1425" y1="384" x2="1425" y2="408" class="wire"/>
<text x="1490" y="401" class="tiny" text-anchor="start">cell group 3</text>
<line x1="1390" y1="439" x2="1475" y2="439" class="wire"/>
<line x1="1407" y1="432" x2="1407" y2="446" class="wire"/>
<line x1="1425" y1="427" x2="1425" y2="451" class="wire"/>
<text x="1490" y="444" class="tiny" text-anchor="start">cell group 4</text>
<line x1="1390" y1="482" x2="1475" y2="482" class="wire"/>
<line x1="1407" y1="475" x2="1407" y2="489" class="wire"/>
<line x1="1425" y1="470" x2="1425" y2="494" class="wire"/>
<text x="1490" y="487" class="tiny" text-anchor="start">cell group 5</text>
<line x1="1390" y1="525" x2="1475" y2="525" class="wire"/>
<line x1="1407" y1="518" x2="1407" y2="532" class="wire"/>
<line x1="1425" y1="513" x2="1425" y2="537" class="wire"/>
<text x="1490" y="530" class="tiny" text-anchor="start">cell group 6</text>
<text x="1432.5" y="642" class="small" text-anchor="middle">18–25.2 V module</text>
<rect x="1235" y="330" width="105" height="190" rx="3" class="connector"/>
<text x="1287.5" y="362" class="block-title" text-anchor="middle">J1</text>
<text x="1287.5" y="386" class="small" text-anchor="middle">MIDDLE</text>
<text x="1287.5" y="408" class="small" text-anchor="middle">PLUG</text>
<circle cx="1273" cy="432" r="3" class="junction"/>
<circle cx="1302" cy="432" r="3" class="junction"/>
<line x1="1273" y1="432" x2="1302" y2="432" class="pin"/>
<circle cx="1273" cy="448" r="3" class="junction"/>
<circle cx="1302" cy="448" r="3" class="junction"/>
<line x1="1273" y1="448" x2="1302" y2="448" class="pin"/>
<circle cx="1273" cy="464" r="3" class="junction"/>
<circle cx="1302" cy="464" r="3" class="junction"/>
<line x1="1273" y1="464" x2="1302" y2="464" class="pin"/>
<circle cx="1273" cy="480" r="3" class="junction"/>
