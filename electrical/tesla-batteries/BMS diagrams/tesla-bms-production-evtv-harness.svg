<line x1="1273" y1="480" x2="1302" y2="480" class="pin"/>
<circle cx="1273" cy="496" r="3" class="junction"/>
<circle cx="1302" cy="496" r="3" class="junction"/>
<line x1="1273" y1="496" x2="1302" y2="496" class="pin"/>
<line x1="1340" y1="425.0" x2="1320" y2="425.0" class="wire"/>
<polyline points="1170,310 1195,310 1195,425.0 1235,425.0" class="wire"/>
<text x="1288" y="560" class="note" text-anchor="middle"><tspan x="1288" dy="0">Plug J1 directly into</tspan><tspan x="1288" dy="22">the module BMB.</tspan><tspan x="1288" dy="22">No individual J1 wiring.</tspan></text>
<polyline points="405,565 405,650" class="ground"/>
<line x1="405" y1="630" x2="405" y2="650" class="ground"/>
<line x1="387" y1="650" x2="423" y2="650" class="ground"/>
<line x1="393" y1="657" x2="417" y2="657" class="ground"/>
<line x1="399" y1="664" x2="411" y2="664" class="ground"/>
<rect x="60" y="730" width="700" height="140" rx="5" class="warn-box"/>
<text x="82" y="760" class="warning" text-anchor="start"><tspan x="82" dy="0">BENCH-TEST LIMITATION</tspan><tspan x="82" dy="25">U2 is an I²C MOSFET shifter with 10 kΩ pull-ups. At 612.5 kbaud it may</tspan><tspan x="82" dy="25">have slow rising edges, especially with the 24-inch harness. Do not rely</tspan><tspan x="82" dy="25">on this prototype interface as the only charge/discharge protection.</tspan></text>
<rect x="60" y="895" width="1175" height="82" rx="5" class="note-box"/>
<text x="80" y="922" class="note" text-anchor="start"><tspan x="80" dy="0">Power the Due normally through USB or VIN; use its +5 V header as an output here. This is UART-like serial, not CAN.</tspan><tspan x="80" dy="25">Before power-up, verify the harness revision and J2 cavity numbers with a continuity meter. No 120 Ω terminator is used.</tspan></text>
<text x="55" y="1002" class="footer" text-anchor="start">Reference: collin80/TeslaBMS wiring.pdf • J1 is intentionally simplified because it is a complete mated harness connection.</text>
<text x="1545" y="1002" class="footer" text-anchor="end">Rev B • 2026-08-01</text>
</svg>
