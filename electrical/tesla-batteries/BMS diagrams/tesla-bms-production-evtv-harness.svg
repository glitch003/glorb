<line x1="1100" y1="300" x2="1170" y2="300" class="wire"/>
<line x1="1100" y1="310" x2="1170" y2="310" class="wire"/>
<line x1="1100" y1="320" x2="1170" y2="320" class="wire"/>
<text x="1135" y="287" class="tiny" text-anchor="middle">factory-wired cable</text>
<text x="875" y="265" class="small" text-anchor="start"><tspan x="875" dy="0">Internal signal path:</tspan><tspan x="875" dy="23">BMS_TX → J1/module → J2</tspan><tspan x="875" dy="23">loopback → BMS_RX</tspan><tspan x="875" dy="23">+5 V and GND feed the BMB</tspan></text>
<rect x="875" y="690" width="360" height="190" rx="5" class="loopbox"/>
<text x="1055.0" y="720" class="block-title" text-anchor="middle">J2  UNUSED END PLUG</text>
<text x="1055.0" y="744" class="small" text-anchor="middle">LOOPBACK CAP — only these two jumpers</text>
<circle cx="955" cy="790" r="7" class="junction"/>
<circle cx="1155" cy="790" r="7" class="junction"/>
<polyline points="955,790 1000,790 1000,775 1110,775 1110,790 1155,790" class="wirerx"/>
<text x="933" y="796" class="pin-label" text-anchor="end">pin 2</text>
<text x="1177" y="796" class="pin-label" text-anchor="start">pin 4</text>
<text x="1055.0" y="767" class="net" text-anchor="middle">JP1</text>
<circle cx="955" cy="832" r="7" class="junction"/>
<circle cx="1155" cy="832" r="7" class="junction"/>
<polyline points="955,832 1000,832 1000,817 1110,817 1110,832 1155,832" class="wirerx"/>
<text x="933" y="838" class="pin-label" text-anchor="end">pin 7</text>
<text x="1177" y="838" class="pin-label" text-anchor="start">pin 9</text>
<text x="1055.0" y="809" class="net" text-anchor="middle">JP2</text>
<polyline points="977.5,625 977.5,690" class="wire"/>
<text x="1055.0" y="868" class="tiny" text-anchor="middle">Other J2 pins remain live — cap and insulate</text>
<rect x="1320" y="190" width="225" height="480" rx="5" class="module"/>
<text x="1432.5" y="228" class="block-title" text-anchor="middle">TESLA 6S MODULE</text>
<text x="1432.5" y="254" class="small" text-anchor="middle">original BMB attached</text>
