<text x="605.0" y="485" class="tiny" text-anchor="middle">CHANNEL 2</text>
<text x="475" y="605" class="small" text-anchor="start"><tspan x="475" dy="0">Channels 3 and 4: unused</tspan><tspan x="475" dy="18">On-board pull-ups: nominally 10 kΩ</tspan></text>
