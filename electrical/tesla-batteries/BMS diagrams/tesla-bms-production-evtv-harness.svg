<circle cx="437" cy="425" r="3" class="junction"/>
<text x="482" y="431" class="pin-label" text-anchor="start">LV1</text>
<line x1="437" y1="495" x2="473" y2="495" class="pin"/>
<circle cx="437" cy="495" r="3" class="junction"/>
<text x="482" y="501" class="pin-label" text-anchor="start">LV2</text>
<line x1="437" y1="565" x2="473" y2="565" class="pin"/>
<circle cx="437" cy="565" r="3" class="junction"/>
<text x="482" y="571" class="pin-label" text-anchor="start">GND</text>
<line x1="737" y1="355" x2="773" y2="355" class="pin"/>
<circle cx="773" cy="355" r="3" class="junction"/>
<text x="728" y="361" class="pin-label" text-anchor="end">HV</text>
<line x1="737" y1="425" x2="773" y2="425" class="pin"/>
<circle cx="773" cy="425" r="3" class="junction"/>
<text x="728" y="431" class="pin-label" text-anchor="end">HV1</text>
<line x1="737" y1="495" x2="773" y2="495" class="pin"/>
<circle cx="773" cy="495" r="3" class="junction"/>
<text x="728" y="501" class="pin-label" text-anchor="end">HV2</text>
<line x1="737" y1="565" x2="773" y2="565" class="pin"/>
<circle cx="773" cy="565" r="3" class="junction"/>
<text x="728" y="571" class="pin-label" text-anchor="end">GND</text>
<line x1="520" y1="425" x2="690" y2="425" class="wiretx"/>
<line x1="520" y1="495" x2="690" y2="495" class="wirerx"/>
<text x="605.0" y="415" class="tiny" text-anchor="middle">CHANNEL 1</text>
<text x="605.0" y="485" class="tiny" text-anchor="middle">CHANNEL 2</text>
<text x="475" y="605" class="small" text-anchor="start"><tspan x="475" dy="0">Channels 3 and 4: unused</tspan><tspan x="475" dy="18">On-board pull-ups: nominally 10 kΩ</tspan></text>
<polyline points="358,295 398,295 398,295 437,295" class="wire3"/>
<polyline points="358,355 410,355 410,150 795,150 795,355 773,355" class="wire5"/>
<polyline points="358,425 437,425" class="wiretx" marker-end="url(#arrow-blue)"/>
<polyline points="437,495 358,495" class="wirerx" marker-end="url(#arrow-green)"/>
<polyline points="358,565 405,565 405,565 437,565" class="ground"/>
<rect x="855" y="185" width="260" height="440" rx="5" class="loopbox"/>
<text x="985.0" y="221" class="block-title" text-anchor="middle">EVTV HARNESS</text>
<text x="985.0" y="246" class="small" text-anchor="middle">controller-end plug</text>
<text x="985.0" y="267" class="tiny" text-anchor="middle">(the only user-wired connector)</text>
<line x1="837" y1="355" x2="875" y2="355" class="pin"/>
<circle cx="837" cy="355" r="3" class="junction"/>
<text x="885" y="361" class="pin-label" text-anchor="start">+5V</text>
<line x1="837" y1="425" x2="875" y2="425" class="pin"/>
<circle cx="837" cy="425" r="3" class="junction"/>
<text x="885" y="431" class="pin-label" text-anchor="start">BMS_TX</text>
<line x1="837" y1="495" x2="875" y2="495" class="pin"/>
<circle cx="837" cy="495" r="3" class="junction"/>
<text x="885" y="501" class="pin-label" text-anchor="start">BMS_RX</text>
<line x1="837" y1="565" x2="875" y2="565" class="pin"/>
<circle cx="837" cy="565" r="3" class="junction"/>
<text x="885" y="571" class="pin-label" text-anchor="start">GND</text>
<polyline points="773,355 837,355" class="wire5"/>
<polyline points="773,425 837,425" class="wiretx" marker-end="url(#arrow-blue)"/>
<polyline points="837,495 773,495" class="wirerx" marker-end="url(#arrow-green)"/>
<polyline points="773,565 837,565" class="ground"/>
<text x="873" y="385" class="small" text-anchor="start"><tspan x="873" dy="0">Factory-terminated harness:</tspan><tspan x="873" dy="22">carries +5V / TX / RX / GND</tspan><tspan x="873" dy="22">and daisy-chains all six</tspan><tspan x="873" dy="22">module BMBs internally.</tspan><tspan x="873" dy="22">No jumpers, no loopback cap.</tspan></text>
<line x1="1115" y1="397.0" x2="1205" y2="397.0" class="wire"/>
<line x1="1115" y1="405.0" x2="1205" y2="405.0" class="wire"/>
<line x1="1115" y1="413.0" x2="1205" y2="413.0" class="wire"/>
<text x="1160" y="385.0" class="tiny" text-anchor="middle">factory trunk</text>
<line x1="1205" y1="185.0" x2="1205" y2="545.0" class="wire"/>
<circle cx="1205" cy="405.0" r="5" class="junction"/>
<rect x="1250" y="155" width="300" height="60" rx="5" class="module"/>
<text x="1268" y="179" class="block-title" text-anchor="start">MODULE 1</text>
<text x="1268" y="201" class="small" text-anchor="start">6S • original BMB attached</text>
<rect x="1168" y="171.0" width="44" height="28" rx="4" class="connector"/>
<text x="1190" y="190.0" class="pin-label" text-anchor="middle">P1</text>
<line x1="1212" y1="185.0" x2="1250" y2="185.0" class="wire"/>
<line x1="1205" y1="185.0" x2="1168" y2="185.0" class="wire"/>
<circle cx="1205" cy="185.0" r="5" class="junction"/>
<rect x="1250" y="227" width="300" height="60" rx="5" class="module"/>
<text x="1268" y="251" class="block-title" text-anchor="start">MODULE 2</text>
<text x="1268" y="273" class="small" text-anchor="start">6S • original BMB attached</text>
<rect x="1168" y="243.0" width="44" height="28" rx="4" class="connector"/>
<text x="1190" y="262.0" class="pin-label" text-anchor="middle">P2</text>
<line x1="1212" y1="257.0" x2="1250" y2="257.0" class="wire"/>
<line x1="1205" y1="257.0" x2="1168" y2="257.0" class="wire"/>
<circle cx="1205" cy="257.0" r="5" class="junction"/>
<rect x="1250" y="299" width="300" height="60" rx="5" class="module"/>
<text x="1268" y="323" class="block-title" text-anchor="start">MODULE 3</text>
<text x="1268" y="345" class="small" text-anchor="start">6S • original BMB attached</text>
<rect x="1168" y="315.0" width="44" height="28" rx="4" class="connector"/>
<text x="1190" y="334.0" class="pin-label" text-anchor="middle">P3</text>
<line x1="1212" y1="329.0" x2="1250" y2="329.0" class="wire"/>
<line x1="1205" y1="329.0" x2="1168" y2="329.0" class="wire"/>
<circle cx="1205" cy="329.0" r="5" class="junction"/>
<rect x="1250" y="371" width="300" height="60" rx="5" class="module"/>
<text x="1268" y="395" class="block-title" text-anchor="start">MODULE 4</text>
<text x="1268" y="417" class="small" text-anchor="start">6S • original BMB attached</text>
<rect x="1168" y="387.0" width="44" height="28" rx="4" class="connector"/>
<text x="1190" y="406.0" class="pin-label" text-anchor="middle">P4</text>
<line x1="1212" y1="401.0" x2="1250" y2="401.0" class="wire"/>
<line x1="1205" y1="401.0" x2="1168" y2="401.0" class="wire"/>
<circle cx="1205" cy="401.0" r="5" class="junction"/>
<rect x="1250" y="443" width="300" height="60" rx="5" class="module"/>
<text x="1268" y="467" class="block-title" text-anchor="start">MODULE 5</text>
<text x="1268" y="489" class="small" text-anchor="start">6S • original BMB attached</text>
<rect x="1168" y="459.0" width="44" height="28" rx="4" class="connector"/>
<text x="1190" y="478.0" class="pin-label" text-anchor="middle">P5</text>
<line x1="1212" y1="473.0" x2="1250" y2="473.0" class="wire"/>
<line x1="1205" y1="473.0" x2="1168" y2="473.0" class="wire"/>
<circle cx="1205" cy="473.0" r="5" class="junction"/>
<rect x="1250" y="515" width="300" height="60" rx="5" class="module"/>
<text x="1268" y="539" class="block-title" text-anchor="start">MODULE 6</text>
<text x="1268" y="561" class="small" text-anchor="start">6S • original BMB attached</text>
<rect x="1168" y="531.0" width="44" height="28" rx="4" class="connector"/>
<text x="1190" y="550.0" class="pin-label" text-anchor="middle">P6</text>
<line x1="1212" y1="545.0" x2="1250" y2="545.0" class="wire"/>
<line x1="1205" y1="545.0" x2="1168" y2="545.0" class="wire"/>
<circle cx="1205" cy="545.0" r="5" class="junction"/>
<polyline points="405,565 405,650" class="ground"/>
<line x1="405" y1="630" x2="405" y2="650" class="ground"/>
<line x1="387" y1="650" x2="423" y2="650" class="ground"/>
<line x1="393" y1="657" x2="417" y2="657" class="ground"/>
<line x1="399" y1="664" x2="411" y2="664" class="ground"/>
<rect x="60" y="730" width="780" height="140" rx="5" class="warn-box"/>
<text x="82" y="760" class="warning" text-anchor="start"><tspan x="82" dy="0">BENCH-TEST LIMITATION</tspan><tspan x="82" dy="25">U2 is an I²C MOSFET shifter with 10 kΩ pull-ups. At 612.5 kbaud it may</tspan><tspan x="82" dy="25">have slow rising edges over the harness run. Do not rely on this prototype</tspan><tspan x="82" dy="25">interface as the only charge/discharge protection.</tspan></text>
<rect x="60" y="895" width="1485" height="82" rx="5" class="note-box"/>
<text x="80" y="922" class="note" text-anchor="start"><tspan x="80" dy="0">Power the Due normally through USB or VIN; use its +5 V header as an output here. This is UART-like serial, not CAN.</tspan><tspan x="80" dy="25">The 6-port EVTV harness terminates the BMB daisy chain internally — only the four controller-end wires (+5V / TX / RX / GND) need attention.</tspan></text>
<text x="55" y="1002" class="footer" text-anchor="start">Reference: collin80/TeslaBMS wiring.pdf • Fully-populated harness — no loopback cap, no J1/J2 breakout, no user pin-level splices.</text>
<text x="1545" y="1002" class="footer" text-anchor="end">Rev C • 2026-08-04</text>
</svg>
