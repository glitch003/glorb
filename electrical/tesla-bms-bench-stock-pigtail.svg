<rect x="18" y="18" width="1564" height="1014" rx="0" class="sheet"/>
<text x="55" y="65" class="title" text-anchor="start">BENCH — Arduino Due to one Tesla module via stock pigtail</text>
<text x="55" y="92" class="subtitle" text-anchor="start">No EVTV harness • no loopback jumpers • original 10-pin BMB connector remains plugged into module</text>
