<line x1="955" y1="649" x2="1025" y2="649" class="wirefault"/>
<line x1="1022" y1="613" x2="1032" y2="629" class="nc"/>
<line x1="1022" y1="641" x2="1032" y2="657" class="nc"/>
<text x="1040" y="630" class="net" text-anchor="start">FAULT: pins 6 + 10 (GRAY)</text>
<text x="1040" y="654" class="small" text-anchor="start">leave separate; cap and insulate</text>
