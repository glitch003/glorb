<circle cx="768" cy="580" r="3" class="junction"/>
<text x="723" y="586" class="pin-label" text-anchor="end">GND</text>
<line x1="515" y1="430" x2="685" y2="430" class="wiretx"/>
<line x1="515" y1="505" x2="685" y2="505" class="wirerx"/>
