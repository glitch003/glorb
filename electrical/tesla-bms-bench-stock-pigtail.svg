<polyline points="768,430 850,430 850,360 892,360" class="wiretx" marker-end="url(#arrow-blue)"/>
<polyline points="892,455 865,455 865,505 768,505" class="wirerx" marker-end="url(#arrow-green)"/>
<polyline points="768,580 880,580 880,550 892,550" class="ground"/>
<polyline points="395,580 395,665" class="ground"/>
<line x1="395" y1="645" x2="395" y2="665" class="ground"/>
<line x1="377" y1="665" x2="413" y2="665" class="ground"/>
<line x1="383" y1="672" x2="407" y2="672" class="ground"/>
<line x1="389" y1="679" x2="401" y2="679" class="ground"/>
<rect x="1330" y="195" width="215" height="455" rx="5" class="module"/>
<text x="1437.5" y="233" class="block-title" text-anchor="middle">TESLA 6S MODULE</text>
<text x="1437.5" y="259" class="small" text-anchor="middle">original BMB attached</text>
<line x1="1375" y1="320" x2="1460" y2="320" class="wire"/>
<line x1="1392" y1="313" x2="1392" y2="327" class="wire"/>
<line x1="1410" y1="308" x2="1410" y2="332" class="wire"/>
<text x="1472" y="325" class="tiny" text-anchor="start">1</text>
<line x1="1375" y1="365" x2="1460" y2="365" class="wire"/>
<line x1="1392" y1="358" x2="1392" y2="372" class="wire"/>
