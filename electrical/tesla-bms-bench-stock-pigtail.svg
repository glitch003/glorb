<text x="1472" y="415" class="tiny" text-anchor="start">3</text>
<line x1="1375" y1="455" x2="1460" y2="455" class="wire"/>
<line x1="1392" y1="448" x2="1392" y2="462" class="wire"/>
<line x1="1410" y1="443" x2="1410" y2="467" class="wire"/>
<text x="1472" y="460" class="tiny" text-anchor="start">4</text>
<line x1="1375" y1="500" x2="1460" y2="500" class="wire"/>
<line x1="1392" y1="493" x2="1392" y2="507" class="wire"/>
<line x1="1410" y1="488" x2="1410" y2="512" class="wire"/>
<text x="1472" y="505" class="tiny" text-anchor="start">5</text>
<line x1="1375" y1="545" x2="1460" y2="545" class="wire"/>
<line x1="1392" y1="538" x2="1392" y2="552" class="wire"/>
<line x1="1410" y1="533" x2="1410" y2="557" class="wire"/>
<text x="1472" y="550" class="tiny" text-anchor="start">6</text>
<text x="1437.5" y="622" class="small" text-anchor="middle">18–25.2 V module</text>
<polyline points="1280,420.0 1305,420.0 1305,422.5 1330,422.5" class="wire"/>
<text x="1305" y="408.5" class="tiny" text-anchor="middle">already mated</text>
<rect x="55" y="740" width="730" height="205" rx="5" class="note-box"/>
<text x="78" y="770" class="note" text-anchor="start"><tspan x="78" dy="0">BENCH SPLICE CHECKLIST</tspan><tspan x="78" dy="28">1. With all power removed, identify every wire by molded connector cavity number.</tspan><tspan x="78" dy="28">2. Tie pins 1+5 to Due +5 V; tie pins 3+8 to Due GND.</tspan><tspan x="78" dy="28">3. Tie pins 2+7 to shifter HV1 (commands going into BMB).</tspan><tspan x="78" dy="28">4. Tie pins 4+9 to shifter HV2 (responses coming out of BMB).</tspan><tspan x="78" dy="28">5. Cap pins 6 and 10 separately. Insulate every splice before applying power.</tspan></text>
<rect x="820" y="740" width="725" height="205" rx="5" class="warn-box"/>
<text x="843" y="770" class="warning" text-anchor="start"><tspan x="843" dy="0">DO NOT TRUST WIRE COLOR FOR UART DIRECTION</tspan><tspan x="843" dy="29">Pins 2 and 4 are both blue; pins 7 and 9 are both yellow. A color-only</tspan><tspan x="843" dy="29">splice can connect two outputs together or reverse TX/RX. Confirm cavity</tspan><tspan x="843" dy="29">numbers with continuity mode while the module and all power are disconnected.</tspan><tspan x="843" dy="29">The BSS138 shifter is marginal at 612.5 kbaud; this is an unloaded bench test.</tspan></text>
<text x="55" y="1002" class="footer" text-anchor="start">Reference: collin80/TeslaBMS wiring.pdf • UART-like serial, not CAN • no 120 Ω terminator • module terminals can deliver destructive fault current.</text>
<text x="1545" y="1002" class="footer" text-anchor="end">Bench Rev A • 2026-08-01</text>
</svg>
