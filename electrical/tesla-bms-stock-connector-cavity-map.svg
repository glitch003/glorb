<rect x="55" y="485" width="1490" height="105" rx="5" class="warn-box"/>
<text x="80" y="515" class="warning" text-anchor="start"><tspan x="80" dy="0">ORIENTATION CHECK — DO NOT PICK A VIEW FROM THE LATCH ALONE</tspan><tspan x="80" dy="27">Find a molded cavity ID (ideally 1, 5, 6, or 10) on your actual housing. Use the view that places that ID at the same corner.</tspan><tspan x="80" dy="27">The molded ID is authoritative. The public TeslaBMS wiring drawing gives row numbers, but does not label its physical viewing face.</tspan></text>
<rect x="55" y="620" width="760" height="315" rx="5" class="note-box"/>
<text x="80" y="652" class="note" text-anchor="start"><tspan x="80" dy="0">SAFE CONTINUITY PROCEDURE</tspan><tspan x="80" dy="33">1. Remove Due USB, +5 V, charger, load, and every external connection.</tspan><tspan x="80" dy="33">2. Confirm 0 V on the pigtail wires before selecting continuity mode.</tspan><tspan x="80" dy="33">3. Unplug the 10-pin communications pigtail from the BMB if accessible.</tspan><tspan x="80" dy="33">   Leave the BMB cell-sense connections alone; do not disturb their order.</tspan><tspan x="80" dy="33">4. Touch one fine probe to one female terminal; touch the other to cut wires.</tspan><tspan x="80" dy="33">5. Label the one wire that beeps P1…P10. Avoid bridging adjacent terminals.</tspan><tspan x="80" dy="33">6. Recheck every label from the opposite end before making any splice.</tspan></text>
