<text x="870" y="907" class="tiny" text-anchor="start"><tspan x="870" dy="0">If the connector remains plugged into the BMB, internal paths may create</tspan><tspan x="870" dy="17">extra or weak beeps. Do not infer a cavity number from resistance alone.</tspan></text>
<text x="55" y="988" class="footer" text-anchor="start">Sources: Molex 0015975101 product data (10 circuits, 2 rows) • collin80/TeslaBMS wiring.pdf (electrical cavity mapping). Not to scale.</text>
<text x="1545" y="988" class="footer" text-anchor="end">Connector worksheet Rev A • 2026-08-02</text>
<text x="55" y="1013" class="warning" text-anchor="start">Battery module terminals remain live even when communications power is removed. Keep tools and meter probes away from the module power studs.</text>
