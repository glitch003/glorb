<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Glorb</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Pinned so the packs stay readable while you are working the lights. -->
<header id="topbar">
  <div class="brand">
    <h1>Glorb</h1>
    <div class="stat"><span id="fps">–</span> fps · <span id="pxcount">–</span> px</div>
  </div>
  <div id="meters" class="meters" aria-label="Battery state of charge"></div>
</header>

<main>
  <!-- Controls come before the pattern list: with 52 patterns the grid is
       taller than a phone screen, and the sliders are what gets touched
       while driving. -->
  <aside class="controls">
    <div class="group">
      <label>Brightness <output id="brightnessOut">30%</output></label>
      <input type="range" id="brightness" min="0" max="100" value="30">
    </div>
    <div class="group" id="speedGroup">
      <label>Speed <output id="speedOut">50%</output></label>
      <input type="range" id="speed" min="0" max="100" value="50">
    </div>
    <div class="group" id="densityGroup">
      <label>Density <output id="densityOut">40%</output></label>
      <input type="range" id="density" min="0" max="100" value="40">
    </div>
    <div class="group colors">
      <div id="c1Group"><label>Color 1</label><input type="color" id="color1" value="#0096ff"></div>
      <div id="c2Group"><label>Color 2</label><input type="color" id="color2" value="#ff3c00"></div>
    </div>

    <div class="group patterngroup">
      <label>Pattern
        <input type="search" id="patternFilter" placeholder="filter…" autocomplete="off">
      </label>
      <div id="patterns" class="patterns"></div>
    </div>

    <details class="group">
      <summary>Emoji <span id="emojiCurrent" class="emoji-current"></span></summary>
      <div id="emojis" class="emojis"></div>
      <input type="text" id="emojiCustom" placeholder="paste emoji(s) + enter, e.g. 🔥💀🌈" maxlength="32">
    </details>

    <details class="group hw">
      <summary>Hardware output</summary>
      <label class="row">
        <input type="checkbox" id="hwEnabled">
        <span>Send to hardware</span>
      </label>
      <div class="hwfields">
        <input type="text" id="hwHost" placeholder="host IP (blank = multicast)">
        <select id="hwOrder">
          <option>RGB</option><option>GRB</option><option>RBG</option>
          <option>GBR</option><option>BRG</option><option>BGR</option>
        </select>
      </div>
      <div id="hwStatus" class="hwstatus">hardware off</div>
    </details>
  </aside>

  <section class="viz">
    <div class="viewtabs">
      <button id="view3d" class="active">3D car</button>
      <button id="view2d">2D flat</button>
      <button id="batteryDetail">Battery detail</button>
    </div>
    <canvas id="car"></canvas>
    <p class="hint" id="hint">3D view — drag to orbit. Tubes hang around 3 sides + the front-right corner; front-left open for the driver.</p>
  </section>
</main>

<!-- Battery detail lives in a dialog so the driving view stays one screen. -->
<dialog id="batteryDialog">
  <div class="dlg-head">
    <strong>Battery detail</strong>
    <button id="batteryClose" type="button">Close</button>
  </div>
  <div id="batteryBody" class="dlg-body"></div>
</dialog>

<script src="battery.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
